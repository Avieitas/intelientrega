<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Voltar ao app</title>
<style>
  :root { color-scheme: light dark; --bg:#f6f7f4; --fg:#1b1f1a; --btn:#1B5E20; }
  @media (prefers-color-scheme: dark) { :root { --bg:#121512; --fg:#e8ece6; --btn:#2e7d32; } }
  body { margin:0; min-height:100vh; display:grid; place-items:center; background:var(--bg); color:var(--fg);
         font:16px/1.5 system-ui, sans-serif; padding:16px; box-sizing:border-box; }
  main { max-width:420px; text-align:center; }
  a.btn { display:inline-block; margin-top:16px; padding:14px 22px; border-radius:12px; background:var(--btn);
          color:#fff; text-decoration:none; font-weight:600; }
  small { display:block; margin-top:16px; opacity:.75; }
</style>
</head>
<body>
<main>
  <h1>Pronto!</h1>
  <p>Volte ao <strong>InteliEntrega</strong>. O acesso é liberado assim que o Mercado Pago confirmar o pagamento (normalmente em instantes).</p>
  <a class="btn" href="intelientrega://assinatura">Abrir o app</a>
  <small>Esta página não confirma pagamento nenhum: a confirmação vem direto do Mercado Pago para o nosso servidor.</small>
</main>
</body>
</html>
